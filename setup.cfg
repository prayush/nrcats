[flake8]
# Beyond the package itself, the repo carries scratch/debug scripts, archived
# exports and interactive analysis notebooks.  These are kept for provenance,
# not maintained as library code, so they are excluded from linting alongside
# the existing `test` exclusion.
exclude = .git,test,*__init__.py,__to_eliu,__to_eliu/*,notebooks,notebooks/*,test_*.py,debug_nan.py,scratch_compare_csv.py
max-line-length = 120
ignore = E129 W503 W504 E203 E402
